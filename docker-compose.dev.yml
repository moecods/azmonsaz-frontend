# Frontend-only local development (Next.js). Run the API from the azmonsaz repo separately.
#
# From this directory:
#   docker compose -f docker-compose.dev.yml up
#
# NEXT_PUBLIC_API_URL must be reachable from your browser (not from inside the container).
# Default assumes Laravel is on the host or published as localhost:8000 (e.g. azmonsaz docker-compose.dev.yml).

name: azmonsaz-frontend-dev

services:
  next:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "${NEXT_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      WATCHPACK_POLLING: "true"
    command: ["sh", "-c", "npm ci && npm run dev:network"]
